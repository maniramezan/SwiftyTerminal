name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: swift-format lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure swift-format is available
        run: command -v swift-format >/dev/null 2>&1 || brew install swift-format
      - name: swift-format lint --strict
        run: make lint

  macos:
    name: Test & coverage (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift version
        run: swift --version
      - name: Unit tests with coverage gate
        run: make coverage
      - name: Real-PTY prompt tests
        run: make test-pty

  linux:
    name: Test (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported toolchain and the latest release.
        swift: ["6.2.4", "6.4.1"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python3 for the PTY tests
        run: apt-get update -qq && apt-get install -y -qq python3 libedit-dev
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors
      - name: Real-PTY prompt tests
        run: python3 -I Scripts/test-pty.py

  docs:
    name: DocC
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build documentation
        run: |
          apt-get update -qq && apt-get install -y -qq python3 make
          make docc
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy-docs:
    name: Deploy DocC
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, macos, linux, docs]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
